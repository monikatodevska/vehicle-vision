[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-vision"
version = "0.1.0"
description = "Vehicle detection, evaluation, and video preparation from computer vision research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8,<5"]
ml = ["tensorflow>=2.16,<3", "opencv-python-headless>=4.8,<5"]
dev = ["ruff>=0.6,<1"]

[project.scripts]
vehicle-vision = "vehicle_vision.cli:main"

[tool.setuptools.packages.find]
include = ["vehicle_vision*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]
